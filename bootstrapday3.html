<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Progress Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">

       
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb justify-content-center">
            <li class="breadcrumb-item"><a href="#">Home</a></li>
            <li class="breadcrumb-item"><a href="#">Courses</a></li>
            <li class="breadcrumb-item active" aria-current="page">Web Development</li>
          </ol>
        </nav>

        
        <h1 class="text-center mb-4">Web Development Course <span class="badge bg-primary">New</span></h1>

        
        <p class="mb-1">HTML</p>
        <div class="progress mb-3">
          <div class="progress-bar bg-success progress-bar-striped" role="progressbar"
               style="width: 100%" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">100%</div>
        </div>

        
        <p class="mb-1">CSS</p>
        <div class="progress mb-3">
          <div class="progress-bar bg-primary progress-bar-striped progress-bar-animated" role="progressbar"
               style="width: 75%" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">75%</div>
        </div>

        
        <p class="mb-1">JavaScript</p>
        <div class="progress mb-3">
          <div class="progress-bar" role="progressbar"
               style="width: 50%; background-color: orange;" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">50%</div>
        </div>

       
        <p class="mb-1">Bootstrap</p>
        <div class="progress mb-4">
          <div class="progress-bar bg-danger" role="progressbar"
               style="width: 25%" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">25%</div>
        </div>

       
        <div class="d-flex justify-content-center mb-4">
          <div class="btn-group" role="group" aria-label="Course actions">
            <button type="button" class="btn btn-success">Start</button>
            <button type="button" class="btn btn-warning">Pause</button>
            <button type="button" class="btn btn-danger">Reset</button>
          </div>
        </div>

        
        <nav aria-label="Page navigation">
          <ul class="pagination justify-content-center">
            <li class="page-item active" aria-current="page"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item disabled"><a class="page-link" href="#" tabindex="-1" aria-disabled="true">3</a></li>
          </ul>
        </nav>

      </div>
    </div>
  </div>

</body>
</html>
