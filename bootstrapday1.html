<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Delivery Service</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      padding-bottom: 8px;
    }
    .brand { margin: 0; }
    .nav-links a { margin-left: 15px; }

    .welcome-box {
      border: 1px solid #0d6efd;
      background-color: #0d6efd;
      color: white;
      padding: 16px;
      height: 100%;
    }
    .welcome-text { margin-bottom: 0; }

    .image-box {
      border: 1px solid #ccc;
      padding: 8px;
      height: 100%;
    }
    .food-image {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .footer {
      text-align: center;
      padding: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  
  <header class="container header">
    <h4 class="brand">Food Delivery Service</h4>
    <nav class="nav-links">
      <a href="#">Home</a>
      <a href="#">Contact</a>
    </nav>
  </header>

 
  <main class="container">
    <div class="row g-2">
      <div class="col-12 col-sm-8">
        <div class="welcome-box">
          <h2>Welcome!</h2>
          <p class="welcome-text">We deliver hot, fresh meals from your favorite local restaurants straight to your door.</p>
        </div>
      </div>
      <div class="col-12 col-sm-4">
        <div class="image-box">
          <img class="food-image" src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80" alt="Food">
        </div>
      </div>
    </div>
  </main>

  
  <footer class="footer">
    &copy; 2026 Food Delivery Service
  </footer>

</body>
</html>
