<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comment Filter</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 100px; padding: 8px; box-sizing: border-box; }
    button { margin-top: 8px; padding: 8px 16px; cursor: pointer; }
    #result { margin-top: 1rem; padding: 12px; background: #f3f3f3; border-radius: 6px; display: none; }
    .yes { color: #b00020; font-weight: bold; }
    .no { color: #1b7f3b; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Blog Comment Filter</h2>

  <textarea id="comment">I think this movie was BAD and 100% Stupid! But the Acting was Amazing and 3 actors were great.😀😀</textarea>
  <br>
  <button id="submitBtn">Submit Comment</button>

  <div id="result">
    <p>Banned word found: <span id="banned"></span></p>
    <p>Cleaned comment:</p>
    <p id="cleaned"></p>
    <p>Numbers: <strong id="numbers"></strong></p>
    <p>Capitalized words: <strong id="caps"></strong></p>
  </div>

  <script>
    function filterComment(comment) {
      // 1. Replace banned words (whole words only, case-insensitive)
      const bannedRegex = /\b(bad|ugly|stupid)\b/gi;
      const hasBanned = bannedRegex.test(comment);
      const cleaned = comment.replace(bannedRegex, "***");

      // 2. Count numbers (runs of digits)
      const numberCount = (cleaned.match(/\d+/g) || []).length;

      // 3. Count words starting with a capital letter
      const capitalCount = (cleaned.match(/\b[A-Z]\w*/g) || []).length;

      return { hasBanned, cleaned, numberCount, capitalCount };
    }

    document.getElementById("submitBtn").addEventListener("click", () => {
      const text = document.getElementById("comment").value;
      const { hasBanned, cleaned, numberCount, capitalCount } = filterComment(text);

      const bannedEl = document.getElementById("banned");
      bannedEl.textContent = hasBanned;
      bannedEl.className = hasBanned ? "yes" : "no";

      // textContent (not innerHTML) keeps user input safe from HTML injection
      document.getElementById("cleaned").textContent = cleaned;
      document.getElementById("numbers").textContent = numberCount;
      document.getElementById("caps").textContent = capitalCount;
      document.getElementById("result").style.display = "block";

      console.log(`Banned word found: ${hasBanned}\nCleaned comment: ${cleaned}\nNumbers: ${numberCount}\nCapitalized words: ${capitalCount}`);
    });
  </script>
</body>
</html>
