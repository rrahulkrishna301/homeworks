<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User profile</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-body-tertiary">
<main class="container py-5" style="max-width: 460px;">
  <section class="card shadow-sm">
    <div class="card-body">
      <h1 class="h4 mb-1">User profile</h1>
      <p class="text-body-secondary mb-4">Admin features need an admin account and age 18 or older.</p>

      <form id="profileForm" novalidate>
        <div class="mb-3">
          <label for="userName" class="form-label">Name</label>
          <input type="text" id="userName" class="form-control" placeholder="e.g. Priya" required>
        </div>

        <div class="mb-3">
          <label for="userAge" class="form-label">Age</label>
          <input type="number" id="userAge" class="form-control" min="0" max="120" step="1" placeholder="e.g. 25" required>
        </div>

        <div class="mb-3">
          <label for="isAdmin" class="form-label">Account type</label>
          <select id="isAdmin" class="form-select">
            <option value="true">Admin</option>
            <option value="false">Regular user</option>
          </select>
        </div>

        <button id="checkBtn" type="button" class="btn btn-primary w-100">
          Check admin access
        </button>
      </form>

      <div id="result" class="alert d-none mt-3 mb-0" role="status">
        <div id="message" class="fw-semibold"></div>
        <small id="details"></small>
      </div>
    </div>
  </section>
</main>

<script>
document.getElementById("checkBtn").addEventListener("click", () => {
  // Show the browser's messages and stop if a field is empty or invalid
  document.getElementById("profileForm").reportValidity() && checkAccess();
});

function checkAccess() {
  // Store the details in variables
  const name = document.getElementById("userName").value.trim();
  const age = Number(document.getElementById("userAge").value);
  const isAdmin = document.getElementById("isAdmin").value === "true";

  // Put them in a user object
  const user = { name, age, isAdmin };

  // Age 18 or more AND admin; ternary operator picks the message
  const granted = user.age >= 18 && user.isAdmin;
  const message = granted ? "Access Granted" : "Access Denied";

  // Check if "age" exists in the user object
  const hasAge = "age" in user;

  // Delete "age" after the check
  delete user.age;

  document.getElementById("result").className =
    "alert mt-3 mb-0 " + (granted ? "alert-success" : "alert-danger");
  document.getElementById("message").textContent = message;
  document.getElementById("details").textContent =
    "age exists: " + hasAge + " | User after delete: " + JSON.stringify(user);
}
</script>
</body>
</html>
